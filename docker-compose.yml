services:
  redis:
    image: redis:7-alpine
    container_name: pinpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

# Postgres는 이제 Neon 클라우드 사용 (ADR 002).
# 로컬 개발도 .env의 DATABASE_URL(Neon)에 직접 연결.
